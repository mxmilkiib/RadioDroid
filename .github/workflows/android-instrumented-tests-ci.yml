name: RadioDroid Instrumented Tests CI

on:
  push:
    branches:
      - master
#  pull_request:
#    branches:
#      - master

jobs:
  test:
    # macos-13: Intel runner; x86_64 emulator images need HAXM which
    # Apple Silicon (macos-latest) runners do not support
    runs-on: macos-13
    strategy:
      matrix:
        api-level: [29, 33, 34]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Restore Android virtual device
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: RadioDroid-${{ runner.os }}-avd-api${{ matrix.api-level }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android virtual device if not cached
        uses: reactivecircus/android-emulator-runner@v2
        if: steps.avd-cache.outputs.cache-hit != 'true'
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.api-level < 21 && 'x86' || 'x86_64' }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests on Android virtual device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.api-level < 21 && 'x86' || 'x86_64' }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: /Users/runner/Library/Android/sdk/platform-tools/adb uninstall net.programmierecke.radiodroid2.test; ./gradlew ${{ matrix.api-level < 26 && 'connectedNonplaygmsDebugAndroidTest' ||  matrix.api-level > 29 && 'installPlaygmsDebugAndroidTest' || 'connectedCheck' }}
