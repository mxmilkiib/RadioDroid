name: RadioDroid Release

# Tag pushes (v*) build signed APKs and create a GitHub Release.
# Manual dispatch builds the same APKs and publishes them as a prerelease.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Decode Release Keystore
      run: |
        echo "${{ secrets.RADIODROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
        echo "RADIODROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

    - name: Assemble Release APKs
      run: bash ./gradlew assemblePlaygmsRelease assembleNonplaygmsRelease --stacktrace
      env:
        RADIODROID_KEYSTORE_PASSWORD: ${{ secrets.RADIODROID_KEYSTORE_PASSWORD }}
        RADIODROID_KEY_ALIAS: ${{ secrets.RADIODROID_KEY_ALIAS }}
        RADIODROID_KEY_PASSWORD: ${{ secrets.RADIODROID_KEY_PASSWORD }}

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: radiodroid-apks
        path: app/build/outputs/apk/*/release/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/*/release/*.apk
        generate_release_notes: true

    - name: Create Dev Prerelease
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dev-${{ github.run_number }}
        name: Dev build ${{ github.ref_name }} @ ${{ github.sha }}
        prerelease: true
        files: app/build/outputs/apk/*/release/*.apk
